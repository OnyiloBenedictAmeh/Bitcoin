<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | S Store</title>

    <link
        rel="stylesheet"
        href="../css/main.css"
    >

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <style>

        .admin-login-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

            background: #f5f5f5;

        }


        .admin-login-card {

            width: 100%;

            max-width: 430px;

            background: #fff;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.10);

        }


        .admin-login-logo {

            text-align: center;

            margin-bottom: 30px;

        }


        .admin-login-logo h1 {

            margin: 0;

            font-size: 28px;

        }


        .admin-login-logo p {

            margin-top: 8px;

            color: #777;

        }


        .admin-form-group {

            margin-bottom: 20px;

        }


        .admin-form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;

        }


        .admin-input-wrapper {

            position: relative;

        }


        .admin-input-wrapper i {

            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 20px;

            color: #777;

        }


        .admin-input-wrapper input {

            width: 100%;

            padding: 13px 14px 13px 44px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

        }


        .admin-input-wrapper input:focus {

            border-color: #111;

        }


        .admin-login-button {

            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 10px;

            background: #111;

            color: #fff;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: opacity 0.2s;

        }


        .admin-login-button:hover {

            opacity: 0.85;

        }


        .admin-login-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .admin-message {

            margin-bottom: 20px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            display: none;

        }


        .admin-message.error {

            display: block;

            background: #ffecec;

            color: #b00020;

        }


        .admin-message.success {

            display: block;

            background: #ecfff1;

            color: #16733a;

        }


        .admin-back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #777;

            text-decoration: none;

            font-size: 14px;

        }


        .admin-back:hover {

            color: #111;

        }


        @media (max-width: 480px) {

            .admin-login-card {

                padding: 28px 22px;

            }

        }

    </style>

</head>


<body>


    <main class="admin-login-page">

        <section class="admin-login-card">

            <div class="admin-login-logo">

                <h1>S STORE</h1>

                <p>Administrator Login</p>

            </div>


            <div
                id="adminMessage"
                class="admin-message"
                role="alert"
            ></div>


            <form id="adminLoginForm">

                <div class="admin-form-group">

                    <label for="adminEmail">
                        Email
                    </label>

                    <div class="admin-input-wrapper">

                        <i class="bx bx-envelope"></i>

                        <input
                            type="email"
                            id="adminEmail"
                            name="email"
                            placeholder="Admin email"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <div class="admin-form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <div class="admin-input-wrapper">

                        <i class="bx bx-lock-alt"></i>

                        <input
                            type="password"
                            id="adminPassword"
                            name="password"
                            placeholder="Admin password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="admin-login-button"
                    id="adminLoginButton"
                >

                    <span id="adminLoginButtonText">
                        Sign In
                    </span>

                </button>

            </form>


            <a
                href="../index.html"
                class="admin-back"
            >
                ← Back to Store
            </a>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
