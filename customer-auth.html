<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | S STORE</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; background: #f5f6f8; }
    .auth-card { width: min(460px, calc(100% - 32px)); padding: 32px; border-radius: 16px; background: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.08); }
    .auth-card h1 { margin-top: 0; } .auth-tabs { display:flex; gap:8px; margin: 20px 0; }
    .auth-tabs button { flex:1; padding:10px; border:1px solid #ddd; background:#fff; border-radius:8px; cursor:pointer; }
    .auth-tabs button.active, .auth-card button[type=submit] { background:#111; color:#fff; border-color:#111; }
    .auth-card label { display:block; margin:13px 0 6px; font-weight:600; }
    .auth-card input { width:100%; box-sizing:border-box; padding:11px; border:1px solid #ccc; border-radius:8px; }
    .auth-card button[type=submit] { width:100%; padding:12px; border-radius:8px; margin-top:20px; cursor:pointer; }
    #authMessage { min-height: 22px; margin-top: 12px; color:#b91c1c; } .auth-note { color:#666; font-size:14px; }
  </style>
</head>
<body>
  <main class="auth-card">
    <a href="index.html">← Back to store</a>
    <h1 id="authTitle">Sign in</h1>
    <p class="auth-note">Access your orders and saved profile.</p>
    <div class="auth-tabs"><button type="button" class="active" data-mode="login">Sign in</button><button type="button" data-mode="register">Create account</button></div>
    <form id="authForm">
      <div id="nameField" hidden><label for="authName">Full name</label><input id="authName" autocomplete="name"></div>
      <label for="authEmail">Email</label><input id="authEmail" type="email" required autocomplete="email">
      <label for="authPassword">Password</label><input id="authPassword" type="password" required minlength="8" autocomplete="current-password">
      <button type="submit" id="authSubmit">Sign in</button>
      <div id="authMessage" role="alert"></div>
    </form>
  </main>
  <script src="js/customer-auth.js"></script>
</body>
</html>
