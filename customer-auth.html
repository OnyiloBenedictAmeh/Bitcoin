<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | S STORE</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="auth-back">← Back to store</a>

      <div class="auth-header">
        <span class="eyebrow">ACCOUNT</span>
        <h1 id="authTitle">Sign in</h1>
      </div>

      <p class="auth-note">Access your orders, saved profile, and delivery details.</p>

      <div class="auth-tabs">
        <button type="button" class="active" data-mode="login">Sign in</button>
        <button type="button" data-mode="register">Create account</button>
      </div>

      <form id="authForm" class="auth-form">
        <div id="nameField" class="form-grid auth-name-grid" hidden>
          <div class="form-group">
            <label for="authFirstName">First name</label>
            <input id="authFirstName" autocomplete="given-name">
          </div>

          <div class="form-group">
            <label for="authLastName">Last name</label>
            <input id="authLastName" autocomplete="family-name">
          </div>
        </div>

        <div id="phoneField" class="form-group" hidden>
          <label for="authPhone">Phone number</label>
          <input id="authPhone" type="tel" autocomplete="tel">
        </div>

        <div class="form-group">
          <label for="authEmail">Email address</label>
          <input id="authEmail" type="email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="authPassword">Password</label>
          <input id="authPassword" type="password" required minlength="8" autocomplete="current-password">
        </div>

        <button type="submit" id="authSubmit" class="btn btn-primary">Sign in</button>
        <div id="authMessage" role="alert"></div>
      </form>
    </div>
  </main>

  <script type="module" src="js/customer-auth.js"></script>
</body>
</html>
