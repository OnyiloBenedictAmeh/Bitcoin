<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard | S Store</title>

    <link
        rel="stylesheet"
        href="../css/main.css"
    >

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f6f8;
        }

        .admin-dashboard {
            min-height: 100vh;
        }

        .admin-header {
            height: 70px;
            background: #111;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .admin-brand {
            font-size: 21px;
            font-weight: 700;
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .admin-user-info {
            text-align: right;
        }

        .admin-user-name {
            font-weight: 600;
        }

        .admin-user-role {
            font-size: 12px;
            opacity: .7;
        }

        .admin-logout {
            border: 1px solid rgba(255,255,255,.25);
            background: transparent;
            color: #fff;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .admin-logout:hover {
            background: rgba(255,255,255,.1);
        }

        .admin-content {
            max-width: 1400px;
            margin: auto;
            padding: 35px;
        }

        .admin-welcome {
            margin-bottom: 30px;
        }

        .admin-welcome h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .admin-welcome p {
            margin: 0;
            color: #777;
        }

        .admin-loading {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #777;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 20px;
        }

        .dashboard-card {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            box-shadow:
                0 8px 30px rgba(0,0,0,.05);
        }

        .dashboard-card-icon {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #f0f0f0;
            font-size: 22px;
            margin-bottom: 18px;
        }

        .dashboard-card-label {
            color: #777;
            font-size: 14px;
        }

        .dashboard-card-value {
            font-size: 30px;
            font-weight: 700;
            margin-top: 5px;
        }

        @media (max-width: 900px) {

            .dashboard-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 600px) {

            .admin-header {
                padding: 0 18px;
            }

            .admin-user-info {
                display: none;
            }

            .admin-content {
                padding: 22px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <div
        id="dashboardLoading"
        class="admin-loading"
    >
        Checking administrator session...
    </div>


    <div
        id="adminDashboard"
        class="admin-dashboard"
        hidden
    >

        <header class="admin-header">

            <div class="admin-brand">
                S STORE ADMIN
            </div>


            <div class="admin-user">

                <div class="admin-user-info">

                    <div
                        id="adminUserName"
                        class="admin-user-name"
                    >
                        Administrator
                    </div>

                    <div
                        id="adminUserRole"
                        class="admin-user-role"
                    >
                        Administrator
                    </div>

                </div>


                <button
                    id="logoutButton"
                    class="admin-logout"
                    type="button"
                >
                    <i class="bx bx-log-out"></i>
                    Logout
                </button>

            </div>

        </header>


        <main class="admin-content">

            <section class="admin-welcome">

                <h1>
                    Dashboard
                </h1>

                <p>
                    Welcome back.
                    Here's what's happening
                    with your store.
                </p>

            </section>


            <section class="dashboard-grid">

                <article class="dashboard-card">

                    <div class="dashboard-card-icon">
                        <i class="bx bx-package"></i>
                    </div>

                    <div class="dashboard-card-label">
                        Products
                    </div>

                    <div
                        id="totalProducts"
                        class="dashboard-card-value"
                    >
                        0
                    </div>

                </article>


                <article class="dashboard-card">

                    <div class="dashboard-card-icon">
                        <i class="bx bx-shopping-bag"></i>
                    </div>

                    <div class="dashboard-card-label">
                        Orders
                    </div>

                    <div
                        id="totalOrders"
                        class="dashboard-card-value"
                    >
                        0
                    </div>

                </article>


                <article class="dashboard-card">

                    <div class="dashboard-card-icon">
                        <i class="bx bx-user"></i>
                    </div>

                    <div class="dashboard-card-label">
                        Customers
                    </div>

                    <div
                        id="totalCustomers"
                        class="dashboard-card-value"
                    >
                        0
                    </div>

                </article>


                <article class="dashboard-card">

                    <div class="dashboard-card-icon">
                        <i class="bx bx-bitcoin"></i>
                    </div>

                    <div class="dashboard-card-label">
                        Revenue
                    </div>

                    <div
                        id="totalRevenue"
                        class="dashboard-card-value"
                    >
                        $0
                    </div>

                </article>

            </section>

        </main>

    </div>


    <script src="js/dashboard.js"></script>

</body>

</html>
