<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="View your order details."
    >

    <title>Order Details | Store</title>

    <link
        rel="stylesheet"
        href="css/main.css"
    >

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">

        <div class="container header-inner">

            <a
                href="index.html"
                class="logo"
            >

                <span class="logo-mark">
                    S
                </span>

                <span class="logo-text">
                    STORE
                </span>

            </a>


            <nav
                class="main-nav"
                id="mainNav"
            >

                <a
                    href="index.html"
                    class="nav-link"
                >
                    Home
                </a>

                <a
                    href="shop.html"
                    class="nav-link"
                >
                    Shop
                </a>

                <a
                    href="shop.html"
                    class="nav-link"
                >
                    Categories
                </a>

                <a
                    href="shop.html"
                    class="nav-link"
                >
                    Deals
                </a>

            </nav>


            <div class="header-actions">

                <a
                    href="account.html"
                    class="icon-btn"
                    aria-label="Account"
                >
                    <i class="bx bx-user"></i>
                </a>


                <a
                    href="cart.html"
                    class="cart-btn"
                    aria-label="Shopping cart"
                >

                    <i class="bx bx-shopping-bag"></i>

                    <span
                        class="cart-count"
                    >
                        0
                    </span>

                </a>


                <button
                    class="menu-btn"
                    id="menuBtn"
                    type="button"
                    aria-label="Open menu"
                >

                    <i class="bx bx-menu"></i>

                </button>

            </div>

        </div>

    </header>


    <!-- =========================
         ORDER
    ========================== -->

    <main>

        <section class="order-page">

            <div class="container">

                <!-- =====================
                     BACK
                ====================== -->

                <a
                    href="orders.html"
                    class="text-link order-back"
                >

                    <i class="bx bx-left-arrow-alt"></i>

                    Back to Orders

                </a>


                <!-- =====================
                     ORDER HEADER
                ====================== -->

                <div
                    class="order-header"
                    id="orderHeader"
                >

                    <!-- Rendered by JS -->

                </div>


                <!-- =====================
                     ORDER CONTENT
                ====================== -->

                <div
                    class="order-layout"
                    id="orderLayout"
                >

                    <div class="order-main">

                        <!-- ITEMS -->

                        <section class="order-section">

                            <div class="order-section-heading">

                                <h2>
                                    Items
                                </h2>

                            </div>


                            <div
                                class="order-items"
                                id="orderItems"
                            >

                                <!-- Rendered by JS -->

                            </div>

                        </section>


                        <!-- DELIVERY -->

                        <section class="order-section">

                            <div class="order-section-heading">

                                <h2>
                                    Delivery information
                                </h2>

                            </div>


                            <div
                                class="order-customer"
                                id="orderCustomer"
                            >

                                <!-- Rendered by JS -->

                            </div>

                        </section>

                    </div>


                    <!-- SUMMARY -->

                    <aside class="order-sidebar">

                        <section class="order-summary">

                            <h2>
                                Order Summary
                            </h2>


                            <div class="summary-row">

                                <span>
                                    Subtotal
                                </span>

                                <strong
                                    id="orderSubtotal"
                                >
                                    $0.00
                                </strong>

                            </div>


                            <div class="summary-row">

                                <span>
                                    Shipping
                                </span>

                                <strong
                                    id="orderShipping"
                                >
                                    Calculated
                                </strong>

                            </div>


                            <div class="summary-divider"></div>


                            <div class="summary-total">

                                <span>
                                    Total
                                </span>

                                <strong
                                    id="orderTotal"
                                >
                                    $0.00
                                </strong>

                            </div>

                        </section>


                        <section class="order-payment">

                            <h2>
                                Payment
                            </h2>


                            <div
                                id="orderPayment"
                            >

                                <!-- Rendered by JS -->

                            </div>

                        </section>


                        <a
                            href="shop.html"
                            class="btn btn-primary"
                        >

                            Continue Shopping

                            <i class="bx bx-right-arrow-alt"></i>

                        </a>

                    </aside>

                </div>


                <!-- =====================
                     NOT FOUND
                ====================== -->

                <div
                    class="order-not-found"
                    id="orderNotFound"
                    hidden
                >

                    <div class="order-not-found-icon">

                        <i class="bx bx-package"></i>

                    </div>


                    <h1>
                        Order not found
                    </h1>


                    <p>
                        We couldn't find the order
                        you're looking for.
                    </p>


                    <a
                        href="orders.html"
                        class="btn btn-primary"
                    >
                        View My Orders
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="site-footer">

        <div class="container">

            <div class="footer-bottom">

                <p>

                    &copy;

                    <span id="currentYear"></span>

                    Store. All rights reserved.

                </p>

            </div>

        </div>

    </footer>


    <script
        type="module"
        src="js/order.js"
    ></script>

</body>

</html>
